<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d1c">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<!--ARTIFACT-START-->
<title>Golazo Tormenta Leyendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Saira+Condensed:wght@500;700;800&display=swap">
<style>
/* Layout: one-column phone app. Header with currencies, scrolling view, bottom tab bar; battle is a full-screen stack (rival, players, sphere board). */
:root{
  --bg:#0b0d1c; --bg2:#151935; --panel:#1b2044; --panel2:#242a57; --ink:#f3f4ff; --dim:#9aa1cf;
  --gold:#ffd23a; --flare:#ff4d6d; --line:rgba(255,255,255,.14);
  --fue:#ff5a36; --vie:#35d38a; --tie:#d08b3c; --ray:#ffd23a; --agu:#3aa0ff;
  --display:"Bungee","Impact","Arial Black",sans-serif;
  --ui:"Saira Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font-family:var(--ui);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  background:radial-gradient(120% 60% at 50% -10%,#2b2f6b 0%,transparent 60%),var(--bg)}
header.top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.brand{font-family:var(--display);font-size:18px;line-height:.9;color:var(--gold);transform:skewX(-8deg);flex:1;min-width:0}
.brand small{display:block;font-size:10px;color:var(--dim);letter-spacing:.2em}
.cur{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:3px 10px 3px 4px;font-weight:800;font-variant-numeric:tabular-nums}
.cur i{width:18px;height:18px;border-radius:50%;display:inline-block}
.gem{background:conic-gradient(from 30deg,#ff4d6d,#ffd23a,#35d38a,#3aa0ff,#b36bff,#ff4d6d);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.medal{background:radial-gradient(circle at 35% 30%,#fff3b0,#e0a020 60%,#8a5a00)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:10px 4px 8px;font-weight:800;font-size:14px;letter-spacing:.06em;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.sel{color:var(--gold)}
h2{font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.05em;margin:14px 0 8px;color:var(--gold)}
.sub{color:var(--dim);font-size:14px;margin:0 0 10px;line-height:1.35}

/* Type badge */
.tb{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-family:var(--display);font-size:9px;color:#120c00;border:2px solid rgba(0,0,0,.45);flex:none}
.wheel{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px;color:var(--dim)}

/* Cards */
.card{position:relative;border-radius:10px;padding:3px;aspect-ratio:3/4;max-width:100%;background:#6b5233;overflow:hidden;cursor:pointer;border:0;display:block;width:100%}
.card.r-R{background:linear-gradient(160deg,#a8794a,#5a3b1d)}
.card.r-SR{background:linear-gradient(160deg,#e9eef7,#8b93a8)}
.card.r-SSR{background:linear-gradient(160deg,#fff1a1,#d39a12 55%,#8a5a00)}
.card.r-UR{background:conic-gradient(from 0deg,#ff4d6d,#ffd23a,#35d38a,#3aa0ff,#b36bff,#ff4d6d)}
.card.aw::after{content:"";position:absolute;inset:0;border-radius:10px;box-shadow:inset 0 0 14px 2px #fff;pointer-events:none;animation:aw 1.6s ease-in-out infinite}
@keyframes aw{50%{opacity:.35}}
.card .in{position:relative;width:100%;height:100%;border-radius:8px;overflow:hidden;background:#111}
.card svg.pt{width:100%;height:100%;display:block}
.card .rar{position:absolute;left:3px;top:15px;font-family:var(--display);font-size:11px;padding:1px 4px;border-radius:4px;background:rgba(0,0,0,.65);line-height:1.2}
.card .tb{position:absolute;right:3px;top:3px;width:20px;height:20px;font-size:8px}
.card .st{position:absolute;left:3px;top:2px;font-size:10px;color:var(--gold);text-shadow:0 1px 2px #000;letter-spacing:-1px}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:12px 4px 2px;font-size:11px;font-weight:800;text-align:right;line-height:1;background:linear-gradient(transparent,rgba(0,0,0,.8));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}

/* Story */
.chap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.chap h3{margin:0;font-size:18px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chap h3 small{color:var(--dim);font-size:13px;font-weight:700}
.stage{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);text-align:left;width:100%}
.stage[disabled]{opacity:.4;cursor:not-allowed}
.stage .no{font-family:var(--display);font-size:18px;width:34px;text-align:center;color:var(--gold);flex:none}
.stage .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.stage b{font-size:16px;line-height:1.1}
.stage small{color:var(--dim);font-size:13px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.stage .ok{font-size:12px;font-weight:800;color:#35d38a;flex:none}
.stage .new{font-size:12px;font-weight:800;color:var(--flare);flex:none}

/* Team */
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slot{display:flex;flex-direction:column;gap:3px;align-items:stretch;min-width:0}
.slot .lbl{font-size:10px;font-weight:800;text-align:center;color:var(--dim);letter-spacing:.06em}
.slot.sel .card{outline:3px solid var(--gold);outline-offset:1px}
.slot .empty{aspect-ratio:3/4;border-radius:10px;border:2px dashed var(--line)}
.leader{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.35;margin-top:10px}
.leader b{color:var(--gold)}
.teamstats{display:flex;gap:12px;flex-wrap:wrap;color:var(--dim);font-size:14px;margin-top:6px;font-variant-numeric:tabular-nums}
.teamstats b{color:var(--ink)}
.inteam{position:absolute;inset:auto 0 0 0;background:rgba(255,210,58,.9);color:#201500;font-size:10px;font-weight:800;text-align:center}

/* Summon */
.banner{position:relative;border-radius:16px;overflow:hidden;min-height:200px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;
  background:radial-gradient(80% 90% at 75% 40%,rgba(255,210,58,.35),transparent 60%),linear-gradient(135deg,#2a1255,#0e2a5c)}
.banner .art{position:absolute;right:-10px;top:0;bottom:0;width:58%;display:flex;align-items:flex-end;justify-content:flex-end;gap:0}
.banner .art svg{height:100%;width:auto;max-width:100%;filter:drop-shadow(0 6px 12px rgba(0,0,0,.6))}
.banner .t{position:relative;font-family:var(--display);font-size:clamp(22px,7vw,30px);line-height:.95;color:#fff;text-shadow:0 3px 0 #7a1d2a;max-width:60%}
.banner .d{position:relative;font-size:14px;color:#dfe3ff;max-width:55%}
.pull{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn{font-family:var(--display);font-size:16px;padding:12px 8px;border-radius:12px;border:0;background:linear-gradient(180deg,#ffe066,#ff9a1f);color:#2a1300;box-shadow:0 5px 0 #a3480b;line-height:1.1}
.btn small{display:flex;justify-content:center;align-items:center;gap:4px;font-family:var(--ui);font-weight:800;font-size:14px;margin-top:2px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a3480b}
.btn[disabled]{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.btn.blue{background:linear-gradient(180deg,#7fb4ff,#2f6bff);color:#fff;box-shadow:0 5px 0 #1b3a99}
.ghost{padding:11px;border-radius:12px;border:2px solid var(--line);background:transparent;font-size:16px;font-weight:800}
.rates{font-size:13px;color:var(--dim);margin-top:10px;line-height:1.4}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,6,14,.82);display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.sheet{width:100%;max-width:420px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;margin:auto}
.sheet .head{display:flex;gap:12px}
.sheet .head .card{width:120px;flex:none;cursor:default}
.sheet .head .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.sheet .nm{font-size:22px;font-weight:800;line-height:1.05}
.sheet .meta{color:var(--dim);font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;font-variant-numeric:tabular-nums}
.kv span:nth-child(odd){color:var(--dim)}
.skill{background:var(--panel);border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.35}
.skill b{display:block;font-size:12px;letter-spacing:.1em;color:var(--dim)}
.skill .sa{font-family:var(--display);font-size:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-family:var(--display);text-align:center;font-size:clamp(26px,8vw,38px);margin:0;color:var(--gold)}

/* Summon reveal */
#reveal{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 45%,#1b1450,#05040c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.orb{width:150px;height:150px;border-radius:50%;position:relative;animation:orb .9s ease-in-out infinite alternate}
.orb::before{content:"";position:absolute;inset:-30px;border-radius:50%;background:inherit;filter:blur(30px);opacity:.6}
@keyframes orb{from{transform:scale(.92) rotate(-6deg)}to{transform:scale(1.05) rotate(6deg)}}
.revealCard{width:min(56vw,220px);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3) rotate(-10deg);opacity:0}}
.revName{text-align:center;font-size:22px;font-weight:800}
.revName small{display:block;font-size:14px;color:var(--gold)}
.res{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;max-width:440px}
.res .tag{position:absolute;top:22px;left:0;right:0;text-align:center;font-size:10px;font-weight:800;background:var(--flare);color:#fff}
.res .tag.dup{background:#2f6bff}

/* Battle */
#battle{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:linear-gradient(180deg,#123f25 0%,#1d5a33 38%,#0b0d1c 39%);overflow:hidden;
  padding:calc(env(safe-area-inset-top,0px) + 6px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(12px,env(safe-area-inset-left,0px))}
#battle::before{content:"";position:absolute;inset:0 0 61% 0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 40px,transparent 40px 80px);pointer-events:none}
.btop{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.btop .stg{flex:1;min-width:0;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btop .stg small{color:var(--dim);font-weight:700}
.score{font-family:var(--display);font-size:16px;background:rgba(0,0,0,.45);padding:3px 10px;border-radius:8px;font-variant-numeric:tabular-nums}
.ibtn{width:38px;height:34px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.4);font-weight:800;font-size:14px;flex:none}
.enemy{position:relative;z-index:1;display:flex;align-items:center;gap:12px;flex:1 1 auto;min-height:0;padding:6px 0}
.enemy .por{height:100%;max-height:170px;aspect-ratio:1;flex:none;border-radius:14px;overflow:hidden;border:3px solid var(--line);background:#111;position:relative}
.enemy .por svg{width:100%;height:100%;display:block}
.enemy.hit .por{animation:hit .35s}
@keyframes hit{20%{transform:translate(-6px,3px);filter:brightness(2.5)}40%{transform:translate(6px,-3px)}60%{transform:translate(-3px,0)}}
.enemy .ei{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.enemy .en{font-size:clamp(17px,5vw,22px);font-weight:800;line-height:1.05;display:flex;gap:6px;align-items:center}
.enemy .et{font-size:13px;color:#d6f5df}
.hpbar{height:14px;border-radius:7px;background:rgba(0,0,0,.5);overflow:hidden;border:1px solid rgba(255,255,255,.25);position:relative}
.hpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#ff3d5a,#ff9a3d);transition:width .4s}
.hpbar.team i{background:linear-gradient(90deg,#35d38a,#b6ff6a)}
.hpbar.team.low i{background:linear-gradient(90deg,#ff3d5a,#ff9a3d)}
.hpn{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;color:#e8ffe8}
.phases{display:flex;gap:4px}
.phases i{width:16px;height:6px;border-radius:3px;background:rgba(255,255,255,.25)}
.phases i.done{background:var(--gold)}
.phases i.cur{background:#fff}
.actors{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:18px}
.actor{position:relative;display:flex;flex-direction:column;gap:4px;opacity:.55;transition:opacity .2s,transform .2s}
.actor.now{opacity:1;transform:translateY(-4px)}
.actor.done{opacity:.4}
.actor .card{aspect-ratio:auto;height:clamp(70px,13vh,110px);cursor:default}
.actor .card .in svg{object-fit:cover}
.actor.hurt .card{animation:hit .35s}
.ki{display:grid;grid-template-columns:repeat(12,1fr);gap:1px;height:8px}
.ki i{background:rgba(255,255,255,.12);border-radius:1px}
.ki i.on{background:var(--kc,#ffd23a)}
.ki.super i.on{background:linear-gradient(#fff,var(--kc));box-shadow:0 0 6px var(--kc)}
.kin{font-size:11px;font-weight:800;text-align:center;line-height:1;font-variant-numeric:tabular-nums;color:var(--dim)}
.kin.super{color:var(--gold)}
.atk{position:absolute;top:-18px;left:0;right:0;display:flex;justify-content:center;gap:3px}
.atk span{font-size:11px;font-weight:800;background:#d22f4a;color:#fff;border-radius:5px;padding:0 5px;line-height:15px}
.atk span.s{background:linear-gradient(90deg,#ff3d5a,#ffb000)}
.thp{position:relative;z-index:1;margin:8px 0 6px;display:flex;align-items:center;gap:8px}
.thp .hpbar{flex:1}
.board{position:relative;margin:0 auto;flex:none;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);touch-action:manipulation}
.sph{position:absolute;border-radius:50%;transition:left .25s ease-in,top .25s ease-in,transform .2s,opacity .2s;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);color:rgba(0,0,0,.45);box-shadow:inset -4px -6px 10px rgba(0,0,0,.35),inset 4px 5px 8px rgba(255,255,255,.45),0 2px 4px rgba(0,0,0,.4);cursor:pointer}
.sph.arc{background:conic-gradient(#ff5a36,#ffd23a,#35d38a,#3aa0ff,#b36bff,#ff5a36)!important}
.sph.pick{transform:scale(1.15);box-shadow:0 0 0 3px #fff,0 0 16px #fff}
.sph.gone{transform:scale(.2);opacity:0}
.hint{position:relative;z-index:1;text-align:center;font-size:13px;color:var(--dim);min-height:18px;margin-bottom:6px}
.fx{position:fixed;inset:0;pointer-events:none;z-index:40}
.dmg{position:absolute;font-family:var(--display);font-size:24px;color:#fff;-webkit-text-stroke:1px #400;text-shadow:0 3px 0 #000;animation:dmg 1s forwards;white-space:nowrap;transform:translateX(-50%)}
.dmg.big{font-size:34px;color:var(--gold)}
.dmg.bad{color:#ff6b7f}
.dmg.heal{color:#7dffb0}
@keyframes dmg{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-34px)}}
.ball{position:fixed;width:22px;height:22px;border-radius:50%;z-index:41;background:radial-gradient(circle at 35% 30%,#fff,#ddd 45%,#888);box-shadow:0 0 0 2px #222 inset}
.kfly{position:fixed;width:16px;height:16px;border-radius:50%;z-index:41}
#cut{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;overflow:hidden;background:rgba(3,4,10,.75)}
#cut .band{position:relative;width:140%;height:min(42vw,200px);transform:rotate(-8deg);display:flex;align-items:center;gap:14px;padding-left:20%;
  background:linear-gradient(90deg,#05060c 0%,#05060c 60%,transparent);border-top:6px solid var(--cc);border-bottom:6px solid var(--cc);animation:slide .35s ease-out}
@keyframes slide{from{transform:rotate(-8deg) translateX(-60%)}}
#cut .band svg{height:120%;width:auto;flex:none;filter:drop-shadow(0 0 16px var(--cc))}
#cut .who{font-size:clamp(14px,4vw,18px);font-weight:800;color:#c9d2ff;letter-spacing:.06em}
#cut .nm{font-family:var(--display);font-size:clamp(22px,7.5vw,40px);line-height:.95;color:var(--cc);max-width:60vw;text-shadow:0 3px 0 rgba(0,0,0,.8)}
#cut .lines{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 50%,transparent 0 5deg,rgba(255,255,255,.06) 5deg 6deg);animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#cut .flash{position:absolute;inset:0;background:#fff;animation:flash .25s ease-out .95s both}
@keyframes flash{from{opacity:0}50%{opacity:.9}to{opacity:0}}
#goal{position:fixed;inset:0;z-index:46;display:flex;align-items:center;justify-content:center;pointer-events:none}
#goal span{font-family:var(--display);font-size:clamp(54px,18vw,110px);color:var(--gold);-webkit-text-stroke:2px #5a1020;text-shadow:0 6px 0 #5a1020,0 0 40px rgba(255,210,58,.6);animation:goal 1.4s cubic-bezier(.2,1.4,.4,1) both;transform:skewX(-8deg)}
@keyframes goal{0%{transform:scale(.2) skewX(-8deg);opacity:0}25%{transform:scale(1.1) skewX(-8deg);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(1.4) skewX(-8deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.05s!important}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 60px);transform:translateX(-50%);z-index:70;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.modeLink{display:flex;align-items:center;gap:10px;margin-top:4px;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:800}
.modeLink small{display:block;color:var(--dim);font-weight:600}
</style>

<div id="app">
  <header class="top">
    <div class="brand">GOLAZO TORMENTA<small>LEYENDAS</small></div>
    <div class="cur" title="Gemas"><i class="gem"></i><span id="gems">0</span></div>
    <div class="cur" title="Medallas"><i class="medal"></i><span id="medals">0</span></div>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button data-v="story" class="sel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 5h-5L8 10z"/></svg>Historia</button>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const sleepRaw = ms => new Promise(r => setTimeout(r, ms));
let SPEED = 1;
const sleep = ms => sleepRaw(ms / SPEED);
const fmt = n => Math.round(n).toLocaleString("es-ES");

// ---------- Seeded random ----------
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s){ let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }

// ---------- Types ----------
const ORDER = ["fue","vie","tie","ray","agu"]; // each beats the next one
const TYPES = {
  fue:{ n:"Fuego", s:"FU", c:"#ff5a36" }, vie:{ n:"Viento", s:"VI", c:"#35d38a" }, tie:{ n:"Tierra", s:"TI", c:"#d08b3c" },
  ray:{ n:"Rayo", s:"RA", c:"#ffd23a" }, agu:{ n:"Agua", s:"AG", c:"#3aa0ff" }
};
function typeMult(a, d){ const i = ORDER.indexOf(a), j = ORDER.indexOf(d); if ((i + 1) % 5 === j) return 1.5; if ((j + 1) % 5 === i) return 0.7; return 1; }
const tb = t => `<span class="tb" style="background:${TYPES[t].c}" title="${TYPES[t].n}">${TYPES[t].s}</span>`;

// ---------- Cards ----------
const TEAMC = { rel:"#ff8a1f", gla:"#7fe3ff", vol:"#e8324a", bos:"#3ccf7a", cel:"#9d7bff", lib:"#e9edf5" };
const POSN = { DEL:"Delantero", MED:"Mediocampista", DEF:"Defensa", POR:"Portero" };
// id, name, rarity, type, position, club, hair, hairColor, skin, eye, technique, band
const RAW = [
  ["kai","Kai Tormenta","UR","ray","DEL","rel","spiky","#ffcf3a","#f2c9a0","#1e88ff","Taladro Relámpago","#e33"],
  ["yuki","Yuki Escarcha","UR","agu","MED","gla","flow","#e8f6ff","#f7dcc4","#2bb6ff","Ventisca Absoluta",""],
  ["rocco","Rocco Brasa","UR","fue","DEL","vol","mohawk","#ff4a2a","#d9a27a","#ff8a00","Meteoro Carmesí",""],
  ["nyx","Nyx Hojarasca","UR","vie","DEL","bos","tails","#2a1640","#e9c3a0","#35d38a","Espiral Esmeralda",""],
  ["atlas","Atlas Roca","UR","tie","POR","cel","short","#5a3a1a","#b9825a","#d08b3c","Muralla Titán","#fff"],
  ["duna","Duna","SSR","ray","POR","rel","short","#2b2b2b","#c98f62","#ffd23a","Puño Trueno","#ffd23a"],
  ["bjorn","Bjorn","SSR","agu","POR","gla","flow","#f2d27a","#f7dcc4","#3aa0ff","Muralla de Cristal",""],
  ["ceniza","Ceniza","SSR","fue","MED","vol","tails","#555","#f0c9a6","#ff5a36","Danza de Brasas",""],
  ["liana","Liana","SSR","vie","MED","bos","flow","#7a3fbf","#e8c19c","#35d38a","Látigo de Lianas",""],
  ["magno","Magno","SSR","tie","DEF","vol","short","#1d1d1d","#a86e45","#d08b3c","Placaje Sísmico","#e8324a"],
  ["sora","Sora Alba","SSR","vie","DEL","cel","spiky","#9fd8ff","#f6d8bf","#7b5cff","Halcón Celeste",""],
  ["brisa","Brisa","SR","ray","MED","rel","tails","#ff9cc0","#f6d8bf","#ff8a1f","Pase Chispa",""],
  ["toro","Toro","SR","tie","DEF","rel","mohawk","#3a2a1a","#b07a50","#d08b3c","Embestida",""],
  ["nieve","Nieve","SR","agu","DEF","gla","short","#cfe9ff","#f7dcc4","#3aa0ff","Barrida Helada",""],
  ["pira","Pira","SR","fue","DEL","vol","spiky","#ff7a2a","#e8b48a","#ff3d3d","Tiro Llamarada",""],
  ["musgo","Musgo","SR","vie","DEF","bos","short","#2f6a2f","#d9a982","#35d38a","Trampa de Raíz","#3ccf7a"],
  ["lumi","Lumi","SR","agu","DEL","gla","flow","#b8f0ff","#f6d8bf","#9d7bff","Chut Aurora",""],
  ["nilo","Nilo","R","agu","MED","rel","short","#1a2a4a","#c98f62","#3aa0ff","Tiro Ola",""],
  ["iker","Iker","R","agu","DEF","gla","spiky","#333","#f2c9a0","#3aa0ff","Despeje Frío",""],
  ["cedro","Cedro","R","tie","MED","bos","short","#6b4a2a","#d9a982","#d08b3c","Pase Raíz",""],
  ["basalto","Basalto","R","tie","POR","vol","mohawk","#222","#9b6a45","#d08b3c","Parada Roca","#ff9d2e"],
  ["roble","Roble","R","vie","POR","bos","short","#4a3020","#c98f62","#35d38a","Manos de Corteza","#b78cff"],
  ["tito","Tito","R","fue","DEF","lib","spiky","#d23a1a","#f2c9a0","#ff5a36","Entrada Chispazo",""],
  ["chispa","Chispa","R","ray","DEL","lib","tails","#ffe066","#f6d8bf","#ffd23a","Disparo Voltio",""]
];
const RBASE = { R:{hp:2600,atk:2200,def:1000}, SR:{hp:3600,atk:3100,def:1500}, SSR:{hp:5200,atk:4600,def:2200}, UR:{hp:7200,atk:6600,def:3100} };
const RIDX = { R:0, SR:1, SSR:2, UR:3 };
const SAMULT = [2.2, 2.6, 3.0, 3.5];
const AWCOST = [5, 10, 20, 30];
const CARDS = {};
RAW.forEach(r => {
  const [id, name, rar, type, pos, club, hair, hc, skin, eye, sa, band] = r;
  const ri = RIDX[rar], b = RBASE[rar], h = rng(hash(id));
  const pm = { DEL:[1, 1.15, 0.85], MED:[1, 1, 1], DEF:[1.1, 0.85, 1.3], POR:[1.2, 0.75, 1.45] }[pos];
  const v = () => 0.94 + h() * 0.12;
  const c = { id, name, rar, ri, type, pos, club, sa, saMult:SAMULT[ri],
    hp:Math.round(b.hp * pm[0] * v()), atk:Math.round(b.atk * pm[1] * v()), def:Math.round(b.def * pm[2] * v()),
    look:{ hair, hc, skin, eye, jer:TEAMC[club], band, num: { POR:1, DEF:4, MED:8, DEL:10 }[pos] + (h() * 3 | 0) * (pos === "POR" ? 11 : 1) } };
  // passive
  const P = { atk:0, def:0, ki:0, crit:0, dodge:0, reduce:0, heal:0 };
  if (pos === "DEL"){ P.atk = [10,20,40,60][ri]; P.crit = [0,10,15,25][ri]; }
  if (pos === "MED"){ P.ki = [1,1,2,3][ri]; P.atk = [5,15,30,45][ri]; }
  if (pos === "DEF"){ P.def = [15,30,50,80][ri]; P.dodge = [0,5,10,15][ri]; }
  if (pos === "POR"){ P.def = [20,40,70,100][ri]; P.reduce = [0,10,15,25][ri]; P.heal = [0,3,5,8][ri]; }
  c.P = P;
  const parts = [];
  if (P.atk) parts.push(`ATK +${P.atk}%`);
  if (P.def) parts.push(`DEF +${P.def}%`);
  if (P.ki) parts.push(`+${P.ki} de ki al empezar el turno`);
  if (P.crit) parts.push(`${P.crit}% de golpe crítico`);
  if (P.dodge) parts.push(`${P.dodge}% de esquivar`);
  if (P.reduce) parts.push(`recibe ${P.reduce}% menos daño`);
  if (P.heal) parts.push(`su supertécnica cura ${P.heal}% de vida al equipo`);
  c.passiveText = parts.join(" · ");
  // leader skill
  c.L = [ { all:10, type:0 }, { all:0, type:25 }, { all:10, type:45 }, { all:30, type:70 } ][ri];
  c.leaderText = c.L.type ? `Tipo ${TYPES[type].n}: PV, ATK y DEF +${c.L.type}%` + (c.L.all ? `; resto +${c.L.all}%` : "") : `Todo el equipo: PV, ATK y DEF +${c.L.all}%`;
  CARDS[id] = c;
});
const BYRAR = { R:[], SR:[], SSR:[], UR:[] };
Object.values(CARDS).forEach(c => BYRAR[c.rar].push(c.id));

// ---------- Portraits ----------
let UID = 0;
function shade(hex, f){ const n = parseInt(hex.slice(1), 16); const r = Math.min(255, (n >> 16) * f), g = Math.min(255, ((n >> 8) & 255) * f), b = Math.min(255, (n & 255) * f); return `rgb(${r|0},${g|0},${b|0})`; }
function portrait(lk, bgType, opts = {}){
  const id = "p" + (UID++), hc = lk.hc, hd = shade(hc, 0.6), bg = TYPES[bgType].c;
  let back = "", front = "";
  switch (lk.hair){
    case "spiky": front = `<path d="M23,54 L15,34 L29,36 L22,14 L38,26 L44,4 L54,22 L66,6 L68,28 L84,22 L76,42 L80,54 L72,40 Q50,30 28,40 Z" fill="${hc}" stroke="${hd}" stroke-width="1.5" stroke-linejoin="round"/>`; break;
    case "short": front = `<path d="M26,52 Q22,20 50,18 Q78,20 74,52 Q71,36 62,33 L57,40 L53,32 L46,39 L42,32 Q30,36 26,52Z" fill="${hc}" stroke="${hd}" stroke-width="1.5"/>`; break;
    case "flow": back = `<path d="M23,86 Q12,30 50,18 Q88,30 77,86 Z" fill="${hd}"/>`;
      front = `<path d="M25,56 Q24,20 50,18 Q76,20 75,56 Q70,34 60,36 Q56,28 48,36 Q40,30 34,40 Q28,42 25,56Z" fill="${hc}" stroke="${hd}" stroke-width="1.5"/>`; break;
    case "mohawk": front = `<path d="M41,36 L36,10 L45,16 L48,0 L54,14 L62,8 L60,36 Q50,30 41,36Z" fill="${hc}" stroke="${hd}" stroke-width="1.5"/><path d="M28,46 Q29,30 41,31 L41,36 Q33,38 28,46Z M72,46 Q71,30 59,31 L59,36 Q67,38 72,46Z" fill="${hc}" opacity=".45"/>`; break;
    case "tails": back = `<ellipse cx="18" cy="52" rx="9" ry="16" fill="${hc}" stroke="${hd}" stroke-width="1.5"/><ellipse cx="82" cy="52" rx="9" ry="16" fill="${hc}" stroke="${hd}" stroke-width="1.5"/>`;
      front = `<path d="M26,52 Q22,18 50,18 Q78,18 74,52 Q68,34 58,38 L54,30 L48,38 L42,31 Q32,36 26,52Z" fill="${hc}" stroke="${hd}" stroke-width="1.5"/>`; break;
  }
  const band = lk.band ? `<path d="M26,40 Q50,30 74,40 L74,45 Q50,36 26,45Z" fill="${lk.band}"/>` : "";
  const brow = opts.evil ? `<path d="M34,45 L46,49 M66,45 L54,49" stroke="${hd}" stroke-width="2.4" stroke-linecap="round"/>` : `<path d="M34,46 L45,47 M66,46 L55,47" stroke="${hd}" stroke-width="2.2" stroke-linecap="round"/>`;
  const mouth = opts.evil ? `<path d="M44,67 Q50,64 56,67" stroke="#5a2a2a" stroke-width="1.8" fill="none" stroke-linecap="round"/>` : `<path d="M45,66 Q50,70 55,66" stroke="#5a2a2a" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
  const eye = (x) => `<ellipse cx="${x}" cy="54" rx="5" ry="6.2" fill="#fff"/><ellipse cx="${x}" cy="55" rx="3.7" ry="5" fill="${lk.eye}"/><circle cx="${x}" cy="56" r="1.8" fill="#111"/><circle cx="${x - 1.3}" cy="52.6" r="1.3" fill="#fff"/>`;
  const jt = (parseInt(lk.jer.slice(1), 16) >> 8 & 255) > 170 ? "#111" : "#fff";
  return `<svg class="pt" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs><radialGradient id="${id}" cx="50%" cy="35%" r="75%"><stop offset="0" stop-color="${bg}" stop-opacity=".95"/><stop offset="1" stop-color="#0b0d1c"/></radialGradient></defs>
  <rect width="100" height="100" fill="url(#${id})"/>
  <g opacity=".22" stroke="#fff" stroke-width="1.2">${[0,1,2,3,4,5].map(i => `<line x1="50" y1="40" x2="${50 + Math.cos(i * 1.05 + 0.3) * 90}" y2="${40 + Math.sin(i * 1.05 + 0.3) * 90}"/>`).join("")}</g>
  ${back}
  <path d="M12,102 Q14,80 36,75 L50,82 L64,75 Q86,80 88,102Z" fill="${lk.jer}" stroke="rgba(0,0,0,.35)" stroke-width="1"/>
  <path d="M40,76 L50,86 L60,76" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="2"/>
  <text x="50" y="99" text-anchor="middle" font-family="Bungee,Impact,sans-serif" font-size="11" fill="${jt}">${lk.num}</text>
  <rect x="44" y="68" width="12" height="10" fill="${shade(lk.skin, 0.85)}"/>
  <circle cx="27.5" cy="56" r="4" fill="${shade(lk.skin, 0.9)}"/><circle cx="72.5" cy="56" r="4" fill="${shade(lk.skin, 0.9)}"/>
  <ellipse cx="50" cy="52" rx="22" ry="24" fill="${lk.skin}"/>
  <path d="M30,62 Q50,82 70,62 Q66,74 50,76 Q34,74 30,62Z" fill="${shade(lk.skin, 0.9)}"/>
  ${eye(40)}${eye(60)}${brow}${mouth}
  ${front}${band}
</svg>`;
}
function cardHTML(id, opts = {}){
  const c = CARDS[id], own = save.col[id] || { stars:1, aw:false };
  const stars = "★".repeat(own.stars || 1);
  return `<button class="card r-${c.rar}${own.aw ? " aw" : ""}" data-card="${id}" ${opts.attrs || ""}>
    <span class="in">${portrait(c.look, c.type)}
      <span class="st">${opts.noStars ? "" : stars}</span>${tb(c.type)}
      <span class="rar">${c.rar}${own.aw ? "+" : ""}</span>
      ${opts.name === false ? "" : `<span class="cap">${c.name}</span>`}
      ${opts.extra || ""}
    </span></button>`;
}

// ---------- Save ----------
const KEY = "golazo_leyendas_v1";
const START = { gems:600, medals:0, col:{ chispa:{stars:1,aw:false}, nilo:{stars:1,aw:false}, tito:{stars:1,aw:false}, basalto:{stars:1,aw:false}, brisa:{stars:1,aw:false}, pira:{stars:1,aw:false} },
  team:["brisa","pira","chispa","nilo","tito","basalto"], prog:0, clears:{} };
let save;
try { save = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ save = null; }
if (!save || !save.col) save = JSON.parse(JSON.stringify(START));
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(save)); } catch(e){} updateCur(); }
function updateCur(){ $("gems").textContent = fmt(save.gems); $("medals").textContent = fmt(save.medals); }

// ---------- Audio ----------
let AC = null;
function audio(){ if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } if (AC && AC.state === "suspended") AC.resume(); }
function tone(f, d, type = "sine", v = 0.12, f2 = null, delay = 0){
  if (!AC) return;
  try { const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
  } catch(e){}
}
const sfx = {
  tap(){ tone(660, 0.06, "triangle", 0.06); },
  ki(i){ tone(500 + i * 40, 0.07, "sine", 0.05); },
  kick(){ tone(160, 0.12, "sine", 0.22, 60); },
  hit(){ tone(120, 0.18, "square", 0.08, 50); },
  sup(){ tone(110, 1.0, "sawtooth", 0.07, 880); tone(220, 1.0, "square", 0.03, 1320); },
  goal(){ [523,659,784,1046].forEach((f, i) => tone(f, 0.35, "square", 0.07, null, i * 0.11)); },
  bad(){ tone(200, 0.25, "sawtooth", 0.07, 90); },
  orb(r){ [0,1,2].forEach(i => tone(400 + r * 200 + i * 150, 0.2, "triangle", 0.07, null, i * 0.08)); },
  win(){ [523,659,784,659,784,1046].forEach((f, i) => tone(f, 0.25, "square", 0.06, null, i * 0.13)); }
};
function buzz(p){ try { navigator.vibrate && navigator.vibrate(p); } catch(e){} }
document.addEventListener("pointerdown", audio, { capture:true });

// ---------- Stats ----------
function leaderBonus(capId, c){ const L = CARDS[capId].L; return (c.type === CARDS[capId].type ? L.type : 0) + L.all; }
function unitStats(id, capId){
  const c = CARDS[id], own = save.col[id] || { stars:1, aw:false };
  const m = (1 + 0.08 * ((own.stars || 1) - 1)) * (own.aw ? 1.3 : 1) * (1 + leaderBonus(capId, c) / 100);
  return { id, c, name:c.name, type:c.type, aw:own.aw,
    hp:Math.round(c.hp * m), atk:Math.round(c.atk * m * (1 + c.P.atk / 100)), def:Math.round(c.def * m * (1 + c.P.def / 100)),
    P:c.P, kiMax: own.aw ? 24 : 12 };
}

// ---------- Stages ----------
const RIVALS = [
  { n:"Gatos Callejeros", c:"#8a8a8a" }, { n:"Patio Norte", c:"#4c6ef5" }, { n:"Los Cuervos", c:"#2b2b38" }, { n:"Unión Puerto", c:"#1aa39a" },
  { n:"Tiburones del Sur", c:"#0b6fb8" }, { n:"Titanes de Acero", c:"#6d7a8a" }, { n:"Escuela Lunar", c:"#c9c4ff" }, { n:"Dragones Rojos", c:"#b0182c" },
  { n:"Sombra Imperial", c:"#3b1f5c" }, { n:"Corona Dorada", c:"#d9a520" }, { n:"Tormenta Negra", c:"#16161f" }, { n:"Imperio Vórtice", c:"#5a0f4a" }
];
const CHAPTERS = [ { n:"Torneo de Barrio", from:0, to:4 }, { n:"Liga Regional", from:4, to:8 }, { n:"Copa Tormenta", from:8, to:12 } ];
const ENAMES = ["Garra","Vega","Orión","Draco","Rex","Zafiro","Kuro","Ébano","Rayden","Fénix","Brutus","Silva","Onix","Mamba","Kaos","Nova","Ícaro","Volk"];
const ESA = ["Disparo Sombra","Cañón Oscuro","Tajo de Garra","Rugido Final","Cometa Negro","Golpe Abismo","Torbellino Rojo","Vórtice Imperial"];
const STAGES = [];
for (let s = 0; s < 12; s++){
  const r = rng(9001 + s * 131), riv = RIVALS[s];
  const nph = s < 4 ? 2 : 3;
  const enemies = [];
  for (let p = 0; p < nph; p++){
    const boss = p === nph - 1;
    const type = ORDER[(r() * 5) | 0];
    const nm = s === 11 && boss ? "Emperador Vórtice" : (boss ? "Capitán " : "") + ENAMES[(r() * ENAMES.length) | 0];
    const hairs = ["spiky","short","flow","mohawk","tails"];
    enemies.push({ name:nm, type, boss,
      pos: boss ? "Capitán" : ["Defensa","Mediocampista","Delantero"][p % 3],
      hp:Math.round(15000 * Math.pow(1.3, s) * (boss ? 1.55 : 1)),
      atk:Math.round(2000 * Math.pow(1.165, s) * (boss ? 1.18 : 1)),
      def:Math.round(550 * Math.pow(1.22, s) * (boss ? 1.2 : 1)),
      attacks: 1 + (s >= 2 ? 1 : 0) + (boss && s >= 6 ? 1 : 0),
      saChance: 0.12 + s * 0.025 + (boss ? 0.1 : 0),
      sa: ESA[(r() * ESA.length) | 0],
      look:{ hair:hairs[(r() * 5) | 0], hc:["#111","#3a1a5a","#8a1a1a","#d9d9d9","#1a3a6a","#5a3a1a"][(r() * 6) | 0], skin:["#f2c9a0","#c98f62","#e8b48a","#9b6a45"][(r() * 4) | 0],
        eye:["#ff3d3d","#b36bff","#ffb000","#35d38a"][(r() * 4) | 0], jer:riv.c, band: boss ? "#111" : "", num: boss ? 10 : 2 + p * 3 } });
  }
  STAGES.push({ i:s, name:riv.n, enemies, gems:80 + s * 10, medals:3 + s, rec:Math.round(enemies[nph - 1].hp / 1000) });
}

// ---------- Views ----------
let VIEW = "story", teamSel = 0;
function setView(v){ VIEW = v; document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("sel", b.dataset.v === v)); render(); $("view").scrollTop = 0; }
$("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b){ sfx.tap(); setView(b.dataset.v); } });
function render(){
  updateCur();
  const v = $("view");
  if (VIEW === "story") v.innerHTML = viewStory();
  if (VIEW === "team") v.innerHTML = viewTeam();
  if (VIEW === "summon") v.innerHTML = viewSummon();

function wheelHTML(){ return `<div class="wheel">Ventaja de tipo: ${ORDER.map(t => tb(t)).join(" › ")} › ${tb(ORDER[0])}</div>`; }
function viewStory(){
  let h = `<h2>MODO HISTORIA</h2><p class="sub">Gana cada partido marcando un gol a cada rival: baja su vida a cero. Toca esferas del color de tu jugador para cargar ki; con 12 de ki lanza su supertécnica.</p>${wheelHTML()}`;
  for (const ch of CHAPTERS){
    const done = STAGES.slice(ch.from, ch.to).filter(s => save.clears[s.i]).length;
    h += `<div class="chap" style="margin-top:12px"><h3>${ch.n}<small>${done}/${ch.to - ch.from}</small></h3>`;
    for (let s = ch.from; s < ch.to; s++){
      const st = STAGES[s], locked = s > save.prog, cleared = save.clears[s];
      h += `<button class="stage" data-stage="${s}" ${locked ? "disabled" : ""}>
        <span class="no">${s + 1}</span>
        <span class="tx"><b>vs ${st.name}</b><small>${st.enemies.map(e => tb(e.type)).join("")} · ${st.enemies.length} rivales · Gemas ${cleared ? 20 : st.gems}</small></span>

function sortedCol(){ return Object.keys(save.col).sort((a, b) => CARDS[b].ri - CARDS[a].ri || ORDER.indexOf(CARDS[a].type) - ORDER.indexOf(CARDS[b].type)); }
function viewSummon(){

function viewCol(){

    `<div class="card r-${c.rar}" style="opacity:.35;cursor:default"><span class="in" style="display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:24px;color:var(--dim)">?</span></div>`).join("")}</div>`;

$("view").addEventListener("click", e => {
  const t = e.target;
  const st = t.closest("[data-stage]"); if (st && !st.disabled){ sfx.tap(); startBattle(+st.dataset.stage); return; }
  if (t.closest("#pull1")){ summon(1); return; }
  if (t.closest("#pull10")){ summon(10); return; }
  const info = t.closest("[data-info]"); if (info){ sfx.tap(); showInfo(info.dataset.info); return; }
  const slot = t.closest("[data-slot]"); if (slot){ sfx.tap(); teamSel = +slot.dataset.slot; render(); return; }
  const pick = t.closest("[data-pick]");
  if (pick){
    sfx.tap();
    const id = pick.dataset.pick, cur = save.team.indexOf(id);
    if (cur === teamSel){ showInfo(id); return; }
    if (cur >= 0){ save.team[cur] = save.team[teamSel]; }
    save.team[teamSel] = id;
    teamSel = (teamSel + 1) % 6;
    persist(); render();
  }
});

function modal(html){ $("modalRoot").innerHTML = `<div class="modal" id="mdl"><div class="sheet">${html}</div></div>`; return $("mdl"); }
function closeModal(){ $("modalRoot").innerHTML = ""; }
function toast(msg){ const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }
function showInfo(id){
  const c = CARDS[id], own = save.col[id];
  const s = { hp:Math.round(c.hp * (1 + 0.08 * (own.stars - 1)) * (own.aw ? 1.3 : 1)), atk:Math.round(c.atk * (1 + 0.08 * (own.stars - 1)) * (own.aw ? 1.3 : 1)), def:Math.round(c.def * (1 + 0.08 * (own.stars - 1)) * (own.aw ? 1.3 : 1)) };
  const cost = AWCOST[c.ri], canAw = !own.aw && own.stars >= 3 && save.medals >= cost;
  const m = modal(`<div class="head">${cardHTML(id)}<div class="info"><div class="nm">${c.name}</div>
      <div class="meta">${tb(c.type)} ${TYPES[c.type].n} · ${POSN[c.pos]}</div>
      <div class="meta" style="color:var(--gold)">${"★".repeat(own.stars)}${"☆".repeat(5 - own.stars)} ${own.aw ? "· DESPERTADO" : ""}</div>
      <div class="kv"><span>PV</span><b>${fmt(s.hp)}</b><span>ATK</span><b>${fmt(s.atk)}</b><span>DEF</span><b>${fmt(s.def)}</b></div></div></div>
    <div class="skill"><b>SUPERTÉCNICA · 12 KI</b><span class="sa" style="color:${TYPES[c.type].c}">${c.sa}</span> · daño x${c.saMult}</div>
    ${own.aw ? `<div class="skill"><b>TÉCNICA DEFINITIVA · 24 KI</b><span class="sa" style="color:${TYPES[c.type].c}">${c.sa} Máximo</span> · daño x${(c.saMult * 1.4).toFixed(1)}</div>` : ""}
    <div class="skill"><b>HABILIDAD PASIVA</b>${c.passiveText}</div>
    <div class="skill"><b>HABILIDAD DE LÍDER</b>${c.leaderText}</div>
    ${own.aw ? "" : `<button class="btn" id="awBtn" ${canAw ? "" : "disabled"}>DESPERTAR<small><i class="medal" style="width:14px;height:14px;border-radius:50%;display:inline-block"></i>${cost} · necesita ★3</small></button>`}
    <button class="ghost" id="closeM">Cerrar</button>`);
  m.addEventListener("click", e => {
    if (e.target === m || e.target.closest("#closeM")) closeModal();
    if (e.target.closest("#awBtn") && canAw){
      save.medals -= cost; own.aw = true; persist(); sfx.win(); buzz([40, 30, 80]);
      toast(`¡${c.name} ha despertado!`); showInfo(id); render();
    }
  });
}

// ---------- Summon ----------
function rollRarity(r){ const x = r * 100; return x < 3 ? "UR" : x < 18 ? "SSR" : x < 50 ? "SR" : "R"; }
async function summon(n){
  const cost = n === 1 ? 50 : 450;
  if (save.gems < cost) return;
  save.gems -= cost;
  const res = [];
  for (let i = 0; i < n; i++){
    let rar = rollRarity(Math.random());
    if (n === 10 && i === 9 && !res.some(r => CARDS[r.id].ri >= 2)) rar = Math.random() < 0.17 ? "UR" : "SSR";
    const pool = BYRAR[rar], id = pool[(Math.random() * pool.length) | 0];
    let tag = "new";
    if (save.col[id]){
      if (save.col[id].stars < 5){ save.col[id].stars++; tag = "star"; }
      else { save.medals += AWCOST[CARDS[id].ri]; tag = "medal"; }
    } else save.col[id] = { stars:1, aw:false };
    res.push({ id, tag });
  }
  persist();
  const ov = document.createElement("div"); ov.id = "reveal"; document.body.appendChild(ov);
  let skip = false;
  const skipBtn = () => `<button class="ghost" id="skipR" style="position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 12px)">Saltar</button>`;
  for (const r of res){
    if (skip) break;
    const c = CARDS[r.id];
    const orbBg = { R:"radial-gradient(circle at 35% 30%,#fff,#c98a4a 40%,#5a3b1d)", SR:"radial-gradient(circle at 35% 30%,#fff,#b9c2d6 40%,#59607a)",
      SSR:"radial-gradient(circle at 35% 30%,#fff,#ffd23a 40%,#a86a00)", UR:"conic-gradient(#ff4d6d,#ffd23a,#35d38a,#3aa0ff,#b36bff,#ff4d6d)" }[c.rar];
    ov.innerHTML = `${skipBtn()}<div class="orb" style="background:${orbBg}"></div><div class="revName" style="color:var(--dim)">Toca para abrir</div>`;
    ov.querySelector("#skipR").onclick = e => { e.stopPropagation(); skip = true; };
    sfx.orb(c.ri);
    await new Promise(res2 => { const t = setTimeout(res2, c.ri >= 2 ? 1500 : 700); ov.onclick = () => { clearTimeout(t); res2(); }; });
    if (skip) break;
    if (c.ri >= 2){ buzz(c.ri === 3 ? [60, 40, 120] : 50); sfx.win(); }
    ov.innerHTML = `${skipBtn()}<div class="revealCard">${cardHTML(r.id)}</div><div class="revName">${c.name}<small>${c.rar} · ${TYPES[c.type].n} · ${r.tag === "new" ? "¡NUEVA!" : r.tag === "star" ? "★ +1" : "+ medallas"}</small></div>`;
    ov.querySelector("#skipR").onclick = e => { e.stopPropagation(); skip = true; };
    await new Promise(res2 => { const t = setTimeout(res2, n === 1 ? 4000 : 1300); ov.onclick = () => { clearTimeout(t); res2(); }; });
  }
  ov.onclick = null;
  ov.innerHTML = `<p class="big">RESULTADOS</p><div class="res">${res.map(r => `<div style="position:relative">${cardHTML(r.id, { name:false })}${r.tag === "new" ? `<span class="tag">NUEVA</span>` : r.tag === "star" ? `<span class="tag dup">★+1</span>` : `<span class="tag dup">MEDALLAS</span>`}</div>`).join("")}</div>
    <div class="row2" style="width:100%;max-width:440px"><button class="btn blue" id="rAgain" ${save.gems < cost ? "disabled" : ""}>OTRA x${n}</button><button class="btn" id="rOk">VALE</button></div>`;
  ov.querySelector("#rOk").onclick = () => { ov.remove(); render(); };
  ov.querySelector("#rAgain").onclick = () => { ov.remove(); summon(n); };
  render();
}

// ---------- Battle ----------
let B = null;
const COLS = 6, ROWS = 5;
function startBattle(si){
  const st = STAGES[si], cap = save.team[0];
  const team = save.team.map(id => unitStats(id, cap));
  const hp = team.reduce((a, u) => a + u.hp, 0);
  B = { st, si, phase:0, goals:0, team, hpMax:hp, hp, turn:-1, slot:0, busy:true, actors:[], plan:[], board:[], over:false,
    enemies: st.enemies.map(e => ({ ...e, cur:e.hp })) };
  $("app").hidden = true; $("battle").hidden = false;
  $("bStage").innerHTML = `Partido ${si + 1} <small>vs ${st.name}</small>`;
  $("bSpeed").textContent = "x" + SPEED;
  layoutBoard(); newBoard(); showEnemy(); updateTeamHp();
  setTimeout(() => newTurn(), 300);
}
function E(){ return B.enemies[B.phase]; }
function showEnemy(){
  const e = E();
  $("ePor").innerHTML = portrait(e.look, e.type, { evil:true });
  $("ePor").style.borderColor = TYPES[e.type].c;
  $("eName").innerHTML = `${tb(e.type)}<span>${e.name}</span>`;
  $("eTeam").textContent = `${e.pos} · ${B.st.name}`;
  $("ePh").innerHTML = B.enemies.map((x, i) => `<i class="${i < B.phase ? "done" : i === B.phase ? "cur" : ""}"></i>`).join("");
  updateEnemyHp();
  $("bScore").textContent = `${B.goals} - 0`;
}
function updateEnemyHp(){ const e = E(); $("eHp").style.width = Math.max(0, e.cur / e.hp * 100) + "%"; $("eHpN").textContent = `${fmt(Math.max(0, e.cur))} / ${fmt(e.hp)}`; }
function updateTeamHp(){ const p = Math.max(0, B.hp / B.hpMax); $("tHp").style.width = p * 100 + "%"; $("tHpN").textContent = fmt(Math.max(0, B.hp)); $("tHpBar").classList.toggle("low", p < 0.3); }

function newTurn(){
  if (B.over) return;
  B.turn++;
  const start = (B.turn * 3) % 6;
  B.actors = [0, 1, 2].map(k => { const u = B.team[(start + k) % 6]; return { u, ki: Math.min(u.kiMax, u.P.ki), sup:false }; });
  const e = E();
  B.plan = [];
  for (let i = 0; i < e.attacks; i++) B.plan.push({ slot:(Math.random() * 3) | 0, sup: Math.random() < e.saChance });
  B.slot = 0; B.busy = false;
  renderActors();
  hint();
}
function hint(){
  const a = B.actors[B.slot];
  $("hint").innerHTML = a ? `Turno de <b style="color:${TYPES[a.u.type].c}">${a.u.name}</b>: toca un grupo de esferas ${TYPES[a.u.type].n.toLowerCase()} (+2 ki cada una)` : "";
}
function renderActors(){
  $("actors").innerHTML = B.actors.map((a, i) => {
    const atks = B.plan.filter(p => p.slot === i);
    const kc = TYPES[a.u.type].c;
    return `<div class="actor${i === B.slot ? " now" : i < B.slot ? " done" : ""}" id="act${i}" style="--kc:${kc}">
      <div class="atk">${atks.map(p => `<span class="${p.sup ? "s" : ""}">${p.sup ? "SÚPER" : "ATQ"}</span>`).join("")}</div>
      ${cardHTML(a.u.id, { name:true })}
      ${kiHTML(a)}
    </div>`;
  }).join("");
}
function kiHTML(a){
  const max = a.u.kiMax, k = a.ki;
  const shown = k > 12 ? k - 12 : k;
  return `<div class="ki${k >= 12 ? " super" : ""}">${Array.from({ length:12 }, (_, i) => `<i class="${i < shown ? "on" : ""}"></i>`).join("")}</div>
    <div class="kin${k >= 12 ? " super" : ""}">KI ${k}/${max >= 24 ? 24 : 12}${k >= 24 ? " · ¡DEFINITIVA!" : k >= 12 ? " · ¡SÚPER!" : ""}</div>`;
}
function refreshActor(i){
  const a = B.actors[i], el = $("act" + i);
  if (!el) return;
  el.querySelectorAll(".ki,.kin").forEach(x => x.remove());
  el.insertAdjacentHTML("beforeend", kiHTML(a));
}

// board
let CELL = 50;
function layoutBoard(){
  const W = Math.min(window.innerWidth - 24, 460), H = window.innerHeight;
  CELL = Math.floor(Math.min(W / COLS, (H * 0.36) / ROWS));
  const bd = $("board"); bd.style.width = CELL * COLS + "px"; bd.style.height = CELL * ROWS + "px";
}
window.addEventListener("resize", () => { if (B && !$("battle").hidden){ layoutBoard(); drawBoard(); } });
let SID = 0;
function randSphere(){ const r = Math.random(); return { id: SID++, t: r < 0.06 ? "arc" : ORDER[(Math.random() * 5) | 0] }; }
function newBoard(){ B.board = Array.from({ length:COLS * ROWS }, randSphere); drawBoard(); }
function drawBoard(){
  const bd = $("board"), pad = Math.round(CELL * 0.08), sz = CELL - pad * 2;
  const keep = new Set();
  B.board.forEach((s, i) => {
    if (!s) return;
    keep.add(String(s.id));
    let el = bd.querySelector(`[data-id="${s.id}"]`);
    const x = (i % COLS) * CELL + pad, y = Math.floor(i / COLS) * CELL + pad;
    if (!el){
      el = document.createElement("div");
      el.className = "sph" + (s.t === "arc" ? " arc" : "");
      el.dataset.id = s.id;
      el.style.width = el.style.height = sz + "px";
      el.style.fontSize = Math.round(sz * 0.3) + "px";
      if (s.t !== "arc"){ el.style.background = `radial-gradient(circle at 35% 30%,#fff 0,${TYPES[s.t].c} 38%,${shade(TYPES[s.t].c, 0.55)} 100%)`; el.textContent = TYPES[s.t].s; }
      el.style.left = x + "px"; el.style.top = (y - CELL * ROWS) + "px";
      bd.appendChild(el);
      el.getBoundingClientRect();
    }
    el.style.width = el.style.height = sz + "px";
    el.style.left = x + "px"; el.style.top = y + "px";
    el.dataset.i = i;
  });
  bd.querySelectorAll(".sph").forEach(el => { if (!keep.has(el.dataset.id)) el.remove(); });
}
function cluster(i0){
  const t = B.board[i0].t, seen = new Set([i0]), q = [i0];
  while (q.length){
    const i = q.shift(), x = i % COLS, y = (i / COLS) | 0;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
      const j = ny * COLS + nx; if (seen.has(j)) continue;
      const s = B.board[j];
      if (s.t === t){ seen.add(j); q.push(j); }
      else if (t !== "arc" && s.t === "arc"){ seen.add(j); } // rainbow joins but does not spread
    }
  }
  return [...seen];
}
$("board").addEventListener("click", async e => {
  const el = e.target.closest(".sph");
  if (!el || !B || B.busy || B.over) return;
  B.busy = true;
  const idx = cluster(+el.dataset.i);
  const a = B.actors[B.slot];
  idx.forEach(i => $("board").querySelector(`[data-id="${B.board[i].id}"]`).classList.add("pick"));
  sfx.tap();
  await sleep(160);
  // fly to actor
  const target = $("act" + B.slot).querySelector(".card").getBoundingClientRect();
  const tx = target.left + target.width / 2, ty = target.top + target.height / 2;
  let n = 0;
  for (const i of idx){
    const s = B.board[i], sel = $("board").querySelector(`[data-id="${s.id}"]`);
    const r = sel.getBoundingClientRect();
    const f = document.createElement("div"); f.className = "kfly";
    f.style.background = s.t === "arc" ? "conic-gradient(#ff5a36,#ffd23a,#35d38a,#3aa0ff,#b36bff,#ff5a36)" : TYPES[s.t].c;
    f.style.left = r.left + r.width / 2 - 8 + "px"; f.style.top = r.top + r.height / 2 - 8 + "px";
    document.body.appendChild(f);
    f.animate([{ transform:"translate(0,0) scale(1.4)" }, { transform:`translate(${tx - r.left - r.width / 2}px,${ty - r.top - r.height / 2}px) scale(.6)` }],
      { duration:380 / SPEED, delay:n * 45 / SPEED, easing:"cubic-bezier(.5,0,.8,.6)", fill:"forwards" }).onfinish = () => {
        f.remove();
        a.ki = Math.min(a.u.kiMax, a.ki + (s.t === a.u.type ? 2 : 1));
        sfx.ki(Math.min(12, a.ki)); refreshActor(B.slot);
      };
    sel.classList.add("gone");
    B.board[i] = null;
    n++;
  }
  await sleep(380 + n * 45 + 60);
  // gravity + refill
  for (let x = 0; x < COLS; x++){
    const col = [];
    for (let y = ROWS - 1; y >= 0; y--){ const s = B.board[y * COLS + x]; if (s) col.push(s); }
    for (let y = ROWS - 1, k = 0; y >= 0; y--, k++) B.board[y * COLS + x] = col[k] || randSphere();
  }
  drawBoard();
  await actorAttack(B.slot);
  if (B.over) return;
  if (E().cur <= 0){ await scoreGoal(); return; }
  await enemyAttacks(B.slot);
  if (B.hp <= 0){ defeat(); return; }
  B.slot++;
  if (B.slot >= 3){ await sleep(250); newTurn(); }
  else { renderActorsState(); hint(); B.busy = false; }
});
function renderActorsState(){ B.actors.forEach((a, i) => { const el = $("act" + i); el.classList.toggle("now", i === B.slot); el.classList.toggle("done", i < B.slot); }); }

function floatText(x, y, txt, cls){
  const d = document.createElement("div"); d.className = "dmg " + (cls || ""); d.textContent = txt;
  d.style.left = x + "px"; d.style.top = y + "px"; $("fx").appendChild(d); setTimeout(() => d.remove(), 1100);
}
async function cutIn(look, type, who, name, evil){
  const d = document.createElement("div"); d.id = "cut"; d.style.setProperty("--cc", TYPES[type].c);
  d.innerHTML = `<div class="lines"></div><div class="band">${portrait(look, type, { evil })}<div><div class="who">${who}</div><div class="nm">${name}</div></div></div><div class="flash"></div>`;
  document.body.appendChild(d); sfx.sup(); buzz(40);
  await sleep(1200);
  d.remove();
}
async function flyBall(from, to, color){
  const b = document.createElement("div"); b.className = "ball";
  if (color) b.style.boxShadow = `0 0 0 2px #222 inset,0 0 18px 6px ${color}`;
  document.body.appendChild(b);
  const fx = from.left + from.width / 2 - 11, fy = from.top + from.height / 2 - 11, tx = to.left + to.width / 2 - 11, ty = to.top + to.height / 2 - 11;
  b.style.left = fx + "px"; b.style.top = fy + "px";
  sfx.kick();
  await b.animate([{ transform:"translate(0,0) rotate(0)" }, { transform:`translate(${tx - fx}px,${ty - fy}px) rotate(720deg)` }], { duration:330 / SPEED, easing:"ease-in", fill:"forwards" }).finished;
  b.remove();
}
async function actorAttack(i){
  const a = B.actors[i], u = a.u, e = E(), c = u.c;
  const ult = a.ki >= 24, sup = a.ki >= 12;
  a.sup = sup;
  if (sup) await cutIn(c.look, u.type, u.name.toUpperCase(), ult ? c.sa + " Máximo" : c.sa);
  const mult = ult ? c.saMult * 1.4 : sup ? c.saMult : 1 + a.ki * 0.05;
  const tm = typeMult(u.type, e.type), crit = Math.random() * 100 < u.P.crit;
  const raw = u.atk * mult * tm * (crit ? 1.5 : 1) * (0.95 + Math.random() * 0.1);
  const dmg = Math.round(Math.max(raw * 0.1, raw - e.def));
  const from = $("act" + i).querySelector(".card").getBoundingClientRect(), to = $("ePor").getBoundingClientRect();
  await flyBall(from, to, sup ? TYPES[u.type].c : null);
  e.cur -= dmg; updateEnemyHp(); sfx.hit();
  $("enemy").classList.remove("hit"); void $("enemy").offsetWidth; $("enemy").classList.add("hit");
  floatText(to.left + to.width / 2, to.top + to.height * 0.3, fmt(dmg), sup ? "big" : "");
  if (crit) floatText(to.left + to.width / 2, to.top - 6, "¡CRÍTICO!", "bad");
  if (tm > 1) floatText(to.left + to.width / 2 + 40, to.top + to.height * 0.7, "¡EFICAZ!", "heal");
  if (sup && u.P.heal){ const h = B.hpMax * u.P.heal / 100; B.hp = Math.min(B.hpMax, B.hp + h); updateTeamHp(); const r = $("tHpBar").getBoundingClientRect(); floatText(r.left + r.width / 2, r.top - 10, "+" + fmt(h), "heal"); }
  await sleep(sup ? 650 : 450);
}
async function enemyAttacks(i){
  const e = E(), a = B.actors[i], u = a.u;
  for (const p of B.plan.filter(p => p.slot === i)){
    if (B.hp <= 0) return;
    if (p.sup) await cutIn(e.look, e.type, e.name.toUpperCase(), e.sa, true);
    const to = $("act" + i).querySelector(".card").getBoundingClientRect(), from = $("ePor").getBoundingClientRect();
    await flyBall(from, to, p.sup ? TYPES[e.type].c : "#ff3d5a");
    if (Math.random() * 100 < u.P.dodge){ floatText(to.left + to.width / 2, to.top + 10, "¡ESQUIVA!", "heal"); await sleep(400); continue; }
    const tm = typeMult(e.type, u.type);
    const raw = e.atk * (p.sup ? 1.7 : 1) * tm * (0.9 + Math.random() * 0.2);
    const def = u.def * (a.sup ? 1.3 : 1);
    const dmg = Math.round(Math.max(raw * 0.08, raw - def) * (1 - u.P.reduce / 100));
    B.hp -= dmg; updateTeamHp(); sfx.bad(); buzz(30);
    const el = $("act" + i); el.classList.remove("hurt"); void el.offsetWidth; el.classList.add("hurt");
    floatText(to.left + to.width / 2, to.top + 10, "-" + fmt(dmg), "bad");
    await sleep(500);
  }
}
async function scoreGoal(){
  B.goals++; $("bScore").textContent = `${B.goals} - 0`;
  const g = document.createElement("div"); g.id = "goal"; g.innerHTML = "<span>¡GOL!</span>"; document.body.appendChild(g);
  sfx.goal(); buzz([60, 40, 120]);
  await sleep(1400); g.remove();
  B.phase++;
  if (B.phase >= B.enemies.length){ victory(); return; }
  const heal = B.hpMax * 0.15; B.hp = Math.min(B.hpMax, B.hp + heal); updateTeamHp();
  showEnemy();
  const r = $("tHpBar").getBoundingClientRect(); floatText(r.left + r.width / 2, r.top - 10, "+" + fmt(heal), "heal");
  await sleep(400);
  newTurn();
}
function victory(){
  B.over = true;
  const first = !save.clears[B.si], st = B.st;
  const gems = first ? st.gems : 20, medals = first ? st.medals : 1;
  save.gems += gems; save.medals += medals; save.clears[B.si] = true;
  save.prog = Math.max(save.prog, Math.min(STAGES.length - 1, B.si + 1));
  persist(); sfx.win();
  const m = modal(`<p class="big">¡VICTORIA!</p><p class="sub" style="text-align:center;margin:0">Ganaste ${B.goals} - 0 a ${st.name}</p>
    <div class="kv" style="justify-content:center"><span>Gemas</span><b>+${gems}</b><span>Medallas</span><b>+${medals}</b></div>
    ${B.si === STAGES.length - 1 && first ? `<p class="sub" style="text-align:center">¡Has ganado la Copa Tormenta! Sigue invocando y despertando cartas.</p>` : ""}
    <div class="row2">${B.si + 1 < STAGES.length ? `<button class="btn" id="vNext">SIGUIENTE</button>` : `<button class="btn" id="vSum">INVOCAR</button>`}<button class="ghost" id="vBack">Menú</button></div>`);
  m.addEventListener("click", e => {
    if (e.target.closest("#vNext")){ closeModal(); const n = B.si + 1; exitBattle(); startBattle(n); }
    if (e.target.closest("#vBack")){ closeModal(); exitBattle(); }
    if (e.target.closest("#vSum")){ closeModal(); exitBattle(); setView("summon"); }
  });
}
function defeat(){
  B.over = true; sfx.bad();
  const m = modal(`<p class="big" style="color:var(--flare)">DERROTA</p><p class="sub" style="text-align:center;margin:0">Tu equipo se ha quedado sin fuerzas. Prueba con cartas de tipo ventajoso o despierta a tus mejores jugadores.</p>
    <div class="row2"><button class="btn blue" id="dCont" ${save.gems < 50 ? "disabled" : ""}>SEGUIR<small>50 gemas · vida llena</small></button><button class="ghost" id="dBack">Retirarse</button></div>`);
  m.addEventListener("click", e => {
    if (e.target.closest("#dCont") && save.gems >= 50){ save.gems -= 50; persist(); closeModal(); B.over = false; B.hp = B.hpMax; updateTeamHp(); newTurn(); }
    if (e.target.closest("#dBack")){ closeModal(); exitBattle(); }
  });
}
function exitBattle(){ $("battle").hidden = true; $("app").hidden = false; B = null; render(); }
$("bExit").addEventListener("click", () => {
  if (!B) return;
  const m = modal(`<p class="big">¿RETIRARSE?</p><p class="sub" style="text-align:center;margin:0">Perderás el progreso de este partido.</p><div class="row2"><button class="btn" id="xNo">SEGUIR JUGANDO</button><button class="ghost" id="xYes">Retirarse</button></div>`);
  m.addEventListener("click", e => { if (e.target.closest("#xNo")) closeModal(); if (e.target.closest("#xYes")){ closeModal(); B.over = true; exitBattle(); } });
});
$("bSpeed").addEventListener("click", () => { SPEED = SPEED === 1 ? 2 : 1; $("bSpeed").textContent = "x" + SPEED; });

render();
window.__dbg = { save, CARDS, STAGES, get B(){ return B; } };
})();
</script>
<!--ARTIFACT-END-->
