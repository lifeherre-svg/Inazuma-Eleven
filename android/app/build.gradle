plugins {
    id 'com.android.application'
}

// El juego web (index.html, src/, styles/, assets/) se copia en los assets del APK
// al compilar: la app Android siempre empaqueta la versión actual del juego.
def webAssetsDir = layout.buildDirectory.dir('generated/webassets')

tasks.register('copyWebAssets', Sync) {
    from(rootProject.file('..')) {
        include 'index.html', 'src/**', 'styles/**', 'assets/**'
    }
    into webAssetsDir.map { it.dir('www') }
}

android {
    namespace 'com.ultimatelegends.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ultimatelegends.game'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firma con la clave de depuración para poder instalarlo directamente.
            // Para publicar en Google Play, sustituye por una clave propia (ver android/README.md).
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            assets.srcDirs += [webAssetsDir.get().asFile]
        }
    }

    lint {
        // El análisis lint descarga herramientas adicionales; no es necesario para generar el APK.
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild') { dependsOn 'copyWebAssets' }

dependencies {
    // Alinea las versiones de la librería estándar de Kotlin que traen las dependencias de AndroidX.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.activity:activity:1.9.3'
}
